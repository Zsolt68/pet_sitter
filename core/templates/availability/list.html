<!-- Display sitter availability table with status badges and edit/delete actions -->
{% extends "base.html" %}

{% block content %}
<h2>Sitter Availability</h2>

<a href="{% url 'availability_create' %}" class="btn btn-success mb-3">
    Add Availability
</a>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Sitter</th>
            <th>Date</th>
            <th>Status</th>
            <th style="width: 160px;">Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for item in availability_list %}
        <tr>
            <td>{{ item.sitter }}</td>
            <td>{{ item.date }}</td>
            <td>
                {% if item.is_available %}
                    <span class="badge bg-success">Available</span>
                {% else %}
                    <span class="badge bg-danger">Unavailable</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'availability_update' item.pk %}" class="btn btn-primary btn-sm">
                    Edit
                </a>
                <a href="{% url 'availability_delete' item.pk %}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
