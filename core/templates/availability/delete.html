<!-- Delete confirmation template for sitter availability entries -->
<h1>Delete Availability</h1>

<p>Are you sure you want to delete this availability?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'availability_list' %}" class="btn btn-secondary">Cancel</a>
</form>
